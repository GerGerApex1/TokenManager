import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath 'com.gradleup.shadow:com.gradleup.shadow.gradle.plugin:9.6.1'
    }
}

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group 'me.realized'
version '3.3.0'

compileJava.options.encoding = 'UTF-8'

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    def group = project.group.toString() + "." + project.name.toLowerCase() + ".shaded"

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.yml'
        filter(ReplaceTokens, tokens: [NAME: project.name, VERSION: project.version, SHADED_GROUP: group])
    }
}

repositories {
    mavenCentral()

    maven {
        name 'spigot-repo'
        url 'https://hub.spigotmc.org/nexus/content/repositories/public'
    }

    maven {
        name 'bungeecord-repo'
        url 'https://oss.sonatype.org/content/repositories/snapshots'
    }

    maven {
        name "helpchatRepoReleases"
        url "https://repo.helpch.at/releases"
    }

    maven {
        name 'codemc-repo'
        url 'https://repo.codemc.io/repository/maven-public/'
    }

    maven {
        name 'codemc-creatorfromhell'
        url 'https://repo.codemc.io/repository/creatorfromhell/'
    }
    flatDir {
        dirs "$rootDir/libs/"
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.48'

    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    compileOnly (name: 'MVdWPlaceholderAPI-3.1.1') {
        transitive = false
    }
    compileOnly 'me.clip:placeholderapi:2.12.3'

    // shaded dependencies
    compileOnly 'redis.clients:jedis:8.0.2'
    compileOnly 'org.apache.commons:commons-pool2:2.13.1'
    compileOnly "net.milkbowl.vault:VaultUnlockedAPI:2.16"
    compileOnly 'org.apache.commons:commons-lang3:3.21.0'
    compileOnly 'com.zaxxer:HikariCP:7.1.0'
    compileOnly 'org.slf4j:slf4j-nop:2.0.20'
    compileOnly 'org.bstats:bstats-bukkit:3.2.1'
}

clean.doFirst {
    delete "$rootDir/out/"
}

tasks.named('shadowJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    destinationDirectory.set(file("$rootDir/out/"))
    archiveBaseName.set('TokenManager')
    archiveClassifier.set('') // Replaces 'classifier = null' to remove the '-all' suffix

    dependencies {
        include(dependency('redis.clients:.*'))
        include(dependency('org.apache.commons:.*'))
        include(dependency('com.zaxxer:.*'))
        include(dependency('org.slf4j:.*'))
        include(dependency('org.bstats:.*'))
    }

    def shadedPackage = "${project.group}.${project.name.toLowerCase()}.shaded."

    relocate 'redis.clients', shadedPackage + 'redis.clients'
    relocate 'org.apache.commons.pool2', shadedPackage + 'apache.commons.pool2'
    relocate 'com.zaxxer.hikari', shadedPackage + 'zaxxer.hikari'
    relocate 'org.slf4j', shadedPackage + 'slf4j'
    relocate 'org.bstats', shadedPackage + 'bstats'
}

build.dependsOn(shadowJar)